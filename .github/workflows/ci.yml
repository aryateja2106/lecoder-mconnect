name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check (lint + format)
        run: npm run check --workspace=lecoder-mconnect

      - name: Run type check
        run: npm run typecheck --workspace=lecoder-mconnect

      - name: Run tests (skip native module tests on Linux)
        run: npm run test --workspace=lecoder-mconnect
        env:
          SKIP_NATIVE_TESTS: 'true'

      - name: Build
        run: npm run build --workspace=lecoder-mconnect

  # macOS test suite (also skips native tests - GitHub Actions runners can't spawn PTY)
  test-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (skip native module tests)
        run: npm run test --workspace=lecoder-mconnect
        env:
          SKIP_NATIVE_TESTS: 'true'

      - name: Build
        run: npm run build --workspace=lecoder-mconnect
