name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Lint & typecheck all TypeScript packages
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@lecoder/shared

      # CLI
      - name: Lint CLI
        run: npm run check --workspace=lecoder-mconnect

      - name: Typecheck CLI
        run: npm run typecheck --workspace=lecoder-mconnect

      # Server (uses bun)
      - name: Lint Server
        run: bun run lint
        working-directory: packages/server

      - name: Typecheck Server
        run: bun run typecheck
        working-directory: packages/server

      # Shared
      - name: Typecheck Shared
        run: bun run typecheck
        working-directory: packages/shared

  # ─────────────────────────────────────────────
  # CLI tests (Linux)
  # ─────────────────────────────────────────────
  test-cli:
    name: CLI Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --workspace=lecoder-mconnect
        env:
          SKIP_NATIVE_TESTS: 'true'

      - name: Run tests with coverage
        run: npx vitest run --coverage --reporter=json --outputFile=coverage-report.json
        working-directory: packages/cli
        env:
          SKIP_NATIVE_TESTS: 'true'
        continue-on-error: true

      - name: Upload CLI coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-coverage
          path: packages/cli/coverage/
          retention-days: 14

      - name: Build
        run: npm run build --workspace=lecoder-mconnect

  # ─────────────────────────────────────────────
  # Server tests with PostgreSQL
  # ─────────────────────────────────────────────
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mconnect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: packages/server

      - name: Build shared package
        run: bun run build
        working-directory: packages/shared

      - name: Run unit tests
        run: bun test
        working-directory: packages/server
        env:
          SKIP_INTEGRATION: 'true'
          DATABASE_URL: postgres://postgres:test@localhost:5432/mconnect_test
          JWT_SECRET: ci-test-secret-key-do-not-use-in-production
          DEV_AUTH_BYPASS: 'true'

      - name: Run database migrations
        run: bun run db:migrate
        working-directory: packages/server
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/mconnect_test
        continue-on-error: true

      - name: Run integration tests
        run: bun test --bail src/**/*.integration.test.ts
        working-directory: packages/server
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/mconnect_test
          JWT_SECRET: ci-test-secret-key-do-not-use-in-production
          DEV_AUTH_BYPASS: 'true'
          SKIP_DOCKER_TESTS: 'true'
        continue-on-error: true

      - name: Build server
        run: bun run build
        working-directory: packages/server

  # ─────────────────────────────────────────────
  # Shared package tests
  # ─────────────────────────────────────────────
  test-shared:
    name: Shared Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: packages/shared

      - name: Run tests
        run: bun test
        working-directory: packages/shared

      - name: Build
        run: bun run build
        working-directory: packages/shared

  # ─────────────────────────────────────────────
  # iOS tests on macOS
  # ─────────────────────────────────────────────
  test-ios:
    name: iOS Tests
    runs-on: macos-14
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and test
        run: |
          xcodebuild test \
            -project packages/ios-app/MConnect.xcodeproj \
            -scheme MConnect \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
          retention-days: 14

  # ─────────────────────────────────────────────
  # Build verification (all packages)
  # ─────────────────────────────────────────────
  build:
    name: Build All
    runs-on: ubuntu-latest
    needs: [test-cli, test-server, test-shared]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -d packages/cli/dist || (echo "CLI build missing" && exit 1)
          test -d packages/shared/dist || (echo "Shared build missing" && exit 1)
          test -d packages/server/dist || (echo "Server build missing" && exit 1)
          echo "All build artifacts present"
