[package]
name = "rmux"
version = "0.3.1"
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "A local terminal multiplexer with a tmux-style CLI, daemon runtime, Rust SDK, and ratatui integration."
readme = "README.md"
keywords = ["terminal", "multiplexer", "cli", "tui"]
categories = ["command-line-interface"]
include = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "build.rs",
    "resources/windows/rmux.exe.manifest",
    "rmux.1",
    "spec/**",
    "src/**",
    "tests/**",
]

[dependencies]
clap = { version = "=4.5.39", features = ["derive"] }
libc = "0.2"
rmux-client = { path = "../rmux-client", version = "0.3.1" }
rmux-core = { path = "../rmux-core", version = "0.3.1" }
rmux-os = { path = "../rmux-os", version = "0.3.1" }
rmux-proto = { path = "../rmux-proto", version = "0.3.1" }
# The root binary owns the hidden internal daemon mode, so it links the server
# and Tokio runtime directly for that top-level re-exec path.
rmux-server = { path = "../rmux-server", version = "0.3.1" }
tokio = { version = "1.48.0", features = ["net", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
libc = "0.2"
rmux-core = { path = "../rmux-core", version = "0.3.1" }
rmux-pty = { path = "../rmux-pty", version = "0.3.1" }
rmux-proto = { path = "../rmux-proto", version = "0.3.1" }
rmux-sdk = { path = "../rmux-sdk", version = "0.3.1" }
rustix = { version = "1.1.4", features = ["event", "termios"] }

[build-dependencies]
embed-manifest = "=1.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[bin]]
name = "rmux"
path = "src/main.rs"
