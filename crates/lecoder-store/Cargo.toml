[package]
name = "lecoder-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Filesystem-for-everything state for LeCoder MConnect: session registry, agent metadata, and scrollback. No rmux, no wall-clock."

[dependencies]
lecoder-proto = { path = "../lecoder-proto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
